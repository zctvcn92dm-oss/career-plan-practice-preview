    function versionCard(no,type,desc,date,state,mode){return `<button onclick="${mode==='current'?'currentPlan()':'historicalPlan()'}" class="soft-card mt-4 flex w-full items-center rounded-card border ${mode==='current'?'border-brand/20 bg-current':'border-line bg-white'} p-4 text-left shadow-soft"><span class="flex h-12 w-12 items-center justify-center rounded-[14px] ${mode==='current'?'bg-brand/15 text-deep':'bg-history text-note'} text-[13px] font-bold">${no}</span><span class="ml-3 flex-1"><b class="block text-[14px]">${type}</b><span class="mt-1 block text-[11px] text-body">${desc}</span><small class="mt-1 block text-[10px] text-note">${date}</small></span><span class="text-[11px] ${mode==='current'?'text-deep':'text-note'}">${state}</span></button>`}

    function reportPage(){const history=appState.reportMode==='history';const plan=activePlan();const profile=planTypeProfiles[appState.planType];const title=history?`${plan.title}（历史版本）`:appState.lowData?'新生入门探索版':plan.title||profile.reportTitle;return pageWrap(`${header('AI 生涯规划书',`<button onclick="openCatalog()" class="absolute right-2 flex h-11 items-center px-3 text-[12px] text-body">目录</button>`)}<div class="safe-bottom px-3 pb-24 pt-3">

      ${summaryChapter()}${abilityChapter()}${interestChapter()}${directionChapter()}${roadmapChapter()}${academicChapter()}${practiceChapter()}${shortcomingChapter()}${officialResourcesChapter()}
      <div class="fixed bottom-0 left-1/2 z-30 flex w-full max-w-[430px] -translate-x-1/2 gap-2 border-t border-line bg-white/95 px-3 py-3 backdrop-blur-md">${history?'':appState.calibrationMode?'<button onclick="toggleCalibration()" class="h-10 flex-1 rounded-control bg-brand text-[12px] font-bold text-white">完成校对</button>':'<button onclick="toggleCalibration()" class="h-10 flex-1 rounded-control bg-brand text-[12px] font-bold text-white">校对与完善</button>'}<button onclick="openPlanVersions('${plan.id}')" class="h-10 flex-1 rounded-control border border-brand/50 text-[12px] text-deep">版本记录</button><button onclick="openExporter()" class="h-10 flex-1 rounded-control border border-brand/50 text-[12px] text-deep">导出 PDF</button></div>

    function chapter(id,no,title,content){return `<section id="${id}" data-annotation-id="${id}-chapter" class="mt-3 rounded-card border border-line bg-white p-4 shadow-soft">${sectionHead(no,title)}${content}</section>`}
    function recommendationFor(id){const base=recommendationDefaults[appState.planType]?.[id]||recommendationDefaults.exploration[id];const saved=appState.recommendationState?.[activePlan().id]?.[id];return {...base,...saved,id}}
    function recommendationCard(id,title,content){const item=recommendationFor(id),display=item.currentContent||content||item.content;return `<article data-recommendation-id="${id}" data-annotation-id="${id}" class="mt-3 rounded-control border border-brand/20 bg-pale p-3"><div class="flex items-start justify-between gap-3"><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><b class="text-[12px]">${title||item.title}</b>${item.adjusted?'<span class="rounded bg-brand/15 px-2 py-0.5 text-[8px] text-deep">已根据个人情况调整</span>':''}</div><p class="mt-1.5 text-[10px] leading-5 text-body">${display}</p>${item.adjustedAt?`<small class="mt-1 block text-[8px] text-note">调整于 ${item.adjustedAt}</small>`:''}</div>${appState.calibrationMode&&appState.reportMode!=='history'?`<button onclick="openFeedback('${id}')" class="shrink-0 rounded-lg border border-brand/40 bg-white px-2.5 py-1.5 text-[9px] text-deep">校正建议</button>`:''}</div></article>`}
    function summaryChapter(){const completeness=appState.lowData?(appState.freshmanAssessmentCompleted?38:20):appState.planType==='job'?91:appState.planType==='direction'?84:78;const currentStage=getCurrentStage();const stageFocus=getStageGrowthFocus(currentStage);const tips={exploration:'当前不宜过早锁定唯一岗位，应先通过测评、专业认知和真实体验验证职业假设。',direction:'当前重点不是继续无限扩展方向，而是通过代表岗位、课程和实践验证方向是否适合。',job:'已具备明确目标岗位，规划重点转为对照岗位要求补齐差距并积累可展示成果。'};return chapter('summary','01','规划摘要',`<div class="grid grid-cols-2 gap-2"><div class="rounded-control bg-current p-3"><small class="text-[10px] text-note">当前阶段</small><b class="mt-1 block text-[14px]">${currentStage.name}<span class="ml-1 text-[10px] font-normal text-note">（${currentStage.semester}）</span></b></div><div class="rounded-control bg-current p-3"><small class="text-[10px] text-note">数据完整度</small><b class="mt-1 block text-[14px]">${completeness}%</b></div></div><div class="mt-2 rounded-control bg-current p-3"><div class="flex items-center justify-between"><small class="text-[10px] text-note">本阶段成长重点</small>${appState.studentChanged?'<span class="rounded bg-brand/15 px-2 py-0.5 text-[9px] text-deep">学生已调整</span>':''}</div><ol class="mt-2 space-y-1.5">${stageFocus.map((focus,index)=>`<li class="flex text-[12px] leading-5"><span class="mr-2 text-deep">${index+1}.</span><b>${focus}</b></li>`).join('')}</ol></div><p class="mt-2 rounded-control bg-warning px-3 py-2 text-[10px] leading-5 text-[#80602C]">${icon('fa-lightbulb','mr-2')}${appState.lowData?(appState.freshmanAssessmentCompleted?'已形成初步价值观线索，但能力画像和职业方向仍需通过课程与实践继续验证。':'当前仅生成低个性化入门探索建议，不输出个人能力、职业倾向或岗位匹配结论。'):tips[appState.planType]}</p>`)}
    function radarPolygon(values,radius){const cx=150,cy=125;return values.map((value,index)=>{const angle=(-90+index*60)*Math.PI/180;const r=radius*(value/100);return `${(cx+Math.cos(angle)*r).toFixed(1)},${(cy+Math.sin(angle)*r).toFixed(1)}`}).join(' ')}
    function abilityRadar(){const full=abilities.map(()=>100);const grids=[25,50,75,100].map(level=>`<polygon class="radar-grid" points="${radarPolygon(full,96*level/100)}"></polygon>`).join('');const axes=abilities.map((_,index)=>{const point=radarPolygon(abilities.map((__,i)=>i===index?100:0),96).split(' ')[index];return `<line class="radar-axis" x1="150" y1="125" x2="${point.split(',')[0]}" y2="${point.split(',')[1]}"></line>`}).join('');const labels=[['150','14','middle'],['260','70','end'],['263','190','end'],['150','242','middle'],['37','190','start'],['37','70','start']].map((pos,index)=>`<text x="${pos[0]}" y="${pos[1]}" text-anchor="${pos[2]}" class="radar-label"><tspan x="${pos[0]}">${abilities[index][0]}</tspan><tspan x="${pos[0]}" dy="13" class="radar-value">${abilities[index][1]}</tspan></text>`).join('');const points=radarPolygon(abilities.map(item=>item[1]),96);const dots=points.split(' ').map(point=>`<circle class="radar-point" cx="${point.split(',')[0]}" cy="${point.split(',')[1]}" r="2.8"></circle>`).join('');return `<div class="ability-radar"><svg viewBox="0 0 300 255" role="img" aria-label="学生生涯画像六维能力雷达图">${grids}${axes}<polygon class="radar-area" points="${points}"></polygon>${dots}${labels}</svg></div>`}
    function abilityChapter(){if(appState.lowData)return chapter('ability','02','学生能力画像',`<div class="flex min-h-[190px] flex-col items-center justify-center rounded-control border border-dashed border-brand/30 bg-current px-6 text-center"><span class="flex h-12 w-12 items-center justify-center rounded-full bg-brand/15 text-deep">${icon('fa-chart-simple','text-[18px]')}</span><b class="mt-3 text-[14px]">能力画像待形成</b><p class="mt-2 text-[10px] leading-5 text-note">当前没有足够的测评、学习和实践数据，不以 0 分代替缺失数据。完成相关体验后将复用平台六维学生生涯画像。</p></div>`);return chapter('ability','02','学生能力画像',abilityRadar()+`<p class="rounded-control bg-pale p-3 text-[10px] leading-5 text-body">画像解读：就业实践能力和专业学习能力是当前优势；社交领导能力相对较弱，建议在项目协作、成果汇报和团队活动中重点提升。</p><p class="mt-2 text-[9px] leading-4 text-note">数据来源：学生生涯画像 · 六维能力口径与平台现有画像保持一致</p>`)}
    function getInterestAnalysis(){const valid=careerAssessments.filter(item=>item.status==='completed'&&item.resultLabel);const weakest=[...abilities].sort((a,b)=>a[1]-b[1])[0];const strong=[...abilities].sort((a,b)=>b[1]-a[1]).slice(0,2);const data=studentGrowthMock[appState.planType]||studentGrowthMock.exploration;const results=valid.length?valid.map(item=>item.interpretation).join('；'):'当前还没有形成有效测评结果';const summary=valid.length?`测评结果显示，${results}结合你的生涯画像，${strong[0][0]}和${strong[1][0]}表现较好，${weakest[0]}仍可通过课程与实践继续积累。结合${data.major}专业，建议先体验设备操作、故障排查或数字化设计等具体任务，再根据真实体验逐步收敛方向。`:`当前没有足够的测评结果形成稳定判断。结合${data.major}专业，建议先完成职业兴趣或职业价值观测评，并通过课程、实训和职业体验积累依据。`;const pending=careerAssessments.find(item=>item.status!=='completed')||null;return {completedAssessments:valid,summary,recommendedAssessment:pending?{name:pending.name,reason:'补充当前职业倾向判断中尚未覆盖的信息。',benefit:'帮助你更清楚地了解适合的工作内容和发展环境。'}:null}}
    function interestChapter(){const analysis=getInterestAnalysis();return chapter('interest','03','职业倾向分析',`<div class="space-y-2">${analysis.completedAssessments.length?analysis.completedAssessments.map(item=>`<article class="rounded-control border border-line bg-current p-3"><div class="flex items-center justify-between"><b class="text-[12px]">${item.name}</b><span class="text-[9px] text-note">已完成</span></div><p class="mt-2 text-[11px] font-medium text-deep">${item.resultLabel}</p><p class="mt-1 text-[10px] leading-5 text-body">${item.interpretation}</p></article>`).join(''):'<div class="rounded-control bg-current p-4 text-[11px] text-note">暂未形成有效测评结果</div>'}</div><div class="mt-3 rounded-control bg-current p-3"><b class="text-[12px]">综合分析</b><p class="mt-2 text-[10px] leading-5 text-body">${analysis.summary}</p></div>${analysis.recommendedAssessment?`<button onclick="openProduct('${analysis.recommendedAssessment.name}','职业测评','具体测评')" class="mt-3 flex w-full items-center rounded-control border border-brand/20 bg-current p-3 text-left"><span class="mr-3 flex h-8 w-8 items-center justify-center rounded-lg bg-brand text-white">${icon('fa-clipboard-question','text-[13px]')}</span><span class="flex-1"><b class="block text-[12px]">推荐测评：${analysis.recommendedAssessment.name}</b><small class="mt-1 block text-[10px] leading-4 text-note">${analysis.recommendedAssessment.reason}${analysis.recommendedAssessment.benefit}</small></span><span class="text-[10px] text-deep">开始测评</span></button>`:'<p class="mt-3 text-[9px] text-note">当前测评信息已较完整，可通过课程和实践继续验证。</p>'}`)}
    function getDirectionAdvice(){const type=appState.planType||'exploration';const data=studentGrowthMock[type]||studentGrowthMock.exploration;const sorted=[...abilities].sort((a,b)=>b[1]-a[1]);const profileTags=sorted.slice(0,2).map(item=>`${item[0]}${item[1]>=75?'较好':'正在积累'}`).concat(`${sorted[sorted.length-1][0]}需补充`);const direction=appState.selectedDirection||'';const job=appState.targetJob||'';const detail=job&&careerPlanJobs.find(item=>item.name===job);if(type==='job'&&job)return {directionLabel:`目标岗位：${job}`,profileTags,actions:[`围绕${detail&&detail.workDirection||'岗位核心任务'}完成一次设备运维实训，保留过程和成果记录`,`结合${data.jobPreparation}，进行一次岗位模拟面试，重点练习案例表达`]};if(type==='direction'&&direction){const jobs=(directionJobMap[direction]||['工业机器人系统运维员','机电设备技术员']).join('、');return {directionLabel:`已选择方向：${direction}`,profileTags,actions:[`比较${jobs}等代表岗位的典型任务和准备要求`,`结合${data.practice}，完成一次方向相关课程项目或实训并记录适配度`]};}return {directionLabel:'当前正在比较智能制造、设备技术和数字化设计等方向',profileTags,actions:['通过课程、实训或职业体验，分别体验设备操作、现场维护和数字化设计任务','记录每次体验的兴趣、表现和感受，比较后再逐步收敛方向']}}
    function getIndustryDirectionAdvice(){const type=appState.planType||'exploration';const data=studentGrowthMock[type]||studentGrowthMock.exploration;const major=data.major||industryDirectionMock.major;const direction=appState.selectedDirection||'';const job=appState.targetJob||'';const directionData=industryDirectionMock.directions[direction];const jobData=industryDirectionMock.jobs[job];if(type==='job'&&job&&jobData)return {title:'行业发展方向',trend:jobData.trend,impact:`结合你选择的${job}，未来准备不能只停留在单一操作，还要关注设备状态、问题分析和现场协作能力。`,focus:jobData.focus,boundary:'行业发展方向用于帮助你了解可能的变化趋势，不代表对未来岗位、就业结果或行业需求的承诺，仍需结合后续课程、实践和实际行业信息持续验证。'};if(type==='direction'&&direction&&directionData)return {title:'行业发展方向',trend:directionData.trend,impact:`结合你选择的${direction}方向，后续应把专业学习和真实任务联系起来，重点验证方向内技术变化是否适合自己的兴趣与能力表现。`,focus:directionData.focus,boundary:'行业发展方向用于帮助你了解可能的变化趋势，不代表对未来岗位、就业结果或行业需求的承诺，仍需结合后续课程、实践和实际行业信息持续验证。'};return {title:'行业发展方向',trend:`${major}相关行业正在从单一设备操作和维修，逐步走向智能设备协同、工业数字化和数据辅助维护。`,impact:'当前正在比较多个专业相关方向，可以先观察不同方向未来的工作任务变化，再通过课程、实训和职业体验验证自己的适配情况。',focus:industryDirectionMock.base.focus,boundary:'行业发展方向用于帮助你了解可能的变化趋势，不代表对未来岗位、就业结果或行业需求的承诺，仍需结合后续课程、实践和实际行业信息持续验证。'} }
    function directionChapter(){const advice=getDirectionAdvice();const industry=getIndustryDirectionAdvice();const intro=advice.directionLabel+'，本模块用于了解代表岗位和准备重点。';return chapter('direction','04','职业发展方向分析',`<div class="space-y-2.5"><div class="flex items-stretch overflow-hidden rounded-control border border-line bg-white"><div class="flex w-14 shrink-0 flex-col items-center justify-center bg-brand text-white"><span class="text-[9px]">NO.</span><b class="text-[20px] leading-5">01</b></div><div class="min-w-0 flex-1 p-3"><b class="block text-[14px] text-title">智能制造</b><div class="mt-2 flex flex-wrap items-center gap-1.5 text-[10px] text-body"><span>代表岗位</span><span class="rounded bg-brand/10 px-2 py-1 text-deep">工业机器人系统运维员</span><span class="rounded bg-brand/10 px-2 py-1 text-deep">自动化设备调试员</span></div></div></div><div class="flex items-stretch overflow-hidden rounded-control border border-line bg-white"><div class="flex w-14 shrink-0 flex-col items-center justify-center bg-brand/90 text-white"><span class="text-[9px]">NO.</span><b class="text-[20px] leading-5">02</b></div><div class="min-w-0 flex-1 p-3"><b class="block text-[14px] text-title">设备技术</b><div class="mt-2 flex flex-wrap items-center gap-1.5 text-[10px] text-body"><span>代表岗位</span><span class="rounded bg-brand/10 px-2 py-1 text-deep">机电设备技术员</span><span class="rounded bg-brand/10 px-2 py-1 text-deep">设备维护员</span></div></div></div><div class="flex items-stretch overflow-hidden rounded-control border border-line bg-white"><div class="flex w-14 shrink-0 flex-col items-center justify-center bg-sky-400 text-white"><span class="text-[9px]">NO.</span><b class="text-[20px] leading-5">03</b></div><div class="min-w-0 flex-1 p-3"><b class="block text-[14px] text-title">数字化设计</b><div class="mt-2 flex flex-wrap items-center gap-1.5 text-[10px] text-body"><span>代表岗位</span><span class="rounded bg-brand/10 px-2 py-1 text-deep">数字化设计技术员</span><span class="rounded bg-brand/10 px-2 py-1 text-deep">机械制图员</span></div></div></div></div><p class="mt-4 rounded-control bg-page p-3 text-[11px] leading-5 text-body">${intro}</p><div class="mt-4 rounded-control border border-brand/20 bg-current p-3"><b class="block text-[12px] text-title">职业发展方向建议</b><div class="mt-3 text-[10px] text-note">当前重点</div><p class="mt-1 text-[11px] leading-5 text-body">${advice.directionLabel}</p><div class="mt-3 text-[10px] text-note">结合你的情况</div><div class="mt-2 flex flex-wrap gap-1.5">${advice.profileTags.map(tag=>`<span class="rounded-full bg-white px-2.5 py-1 text-[9px] text-deep">${tag}</span>`).join('')}</div><div class="mt-3 text-[10px] text-note">下一步建议</div><ol class="mt-2 space-y-2">${advice.actions.map((action,i)=>`<li class="flex text-[10px] leading-5 text-body"><span class="mr-2 text-deep">${i+1}.</span><span>${action}</span></li>`).join('')}</ol></div><div class="mt-3 rounded-control border border-line bg-white p-3"><b class="block text-[12px] text-title">${industry.title}</b><div class="mt-3 text-[10px] text-note">行业变化</div><p class="mt-1 text-[10px] leading-5 text-body">${industry.trend}</p><div class="mt-3 text-[10px] text-note">对你的影响</div><p class="mt-1 text-[10px] leading-5 text-body">${industry.impact}</p><div class="mt-3 text-[10px] text-note">建议关注</div><ul class="mt-2 space-y-1.5">${industry.focus.map(item=>`<li class="flex text-[10px] leading-5 text-body"><span class="mr-2 text-deep">•</span><span>${item}</span></li>`).join('')}</ul><p class="mt-3 rounded-lg bg-page px-2.5 py-2 text-[9px] leading-4 text-note">${industry.boundary}</p></div>`) }
    function roadmapChapter(){const currentStage=getCurrentStage();return chapter('roadmap','05','职业发展阶段目标',`<div class="space-y-3">${semesterStageMap.map((stage,i)=>{const current=stage.semester===currentStage.semester;return `<div class="rounded-control border ${current?'border-brand/30 bg-current':'border-line bg-white'} p-3"><div class="flex items-start"><span class="mr-3 flex h-7 w-7 shrink-0 items-center justify-center rounded-full ${current?'bg-brand text-white':'bg-pale text-deep'} text-[11px]">${i+1}</span><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><b class="text-[12px]">${stage.semester}・${stage.name}</b>${current?'<span class="rounded-full bg-brand px-2 py-1 text-[8px] text-white">当前学期</span>':''}</div><p class="mt-1 text-[10px] leading-5 text-body"><span class="text-note">阶段发展目标：</span>${stage.goal}</p><ol class="mt-2 space-y-1">${getStageGrowthFocus(stage).map((focus,index)=>`<li class="flex text-[10px] leading-5 text-body"><span class="mr-2 text-deep">${index+1}.</span>${focus}</li>`).join('')}</ol></div></div></div>`}).join('')}</div><p class="mt-3 rounded-control bg-page px-3 py-2 text-[10px] leading-5 text-note">当前学期由学籍确定，学生不可修改；阶段名称由学期决定，成长重点由“学期阶段 + 规划类型 + 学生成长数据”共同生成，学生校对后的重点会继续保留。</p>`)}

    function getAcademicAdvice(){const type=appState.planType||'exploration';const data=studentGrowthMock[type]||studentGrowthMock.exploration;const major=data.major||'当前专业';const direction=appState.selectedDirection||'';const job=appState.targetJob||'';const top=[...abilities].sort((a,b)=>b[1]-a[1])[0];const weak=[...abilities].sort((a,b)=>a[1]-b[1])[0];if(type==='job'&&job)return {intentionLabel:`目标岗位：${job}`,profileSummary:`已有${data.practice}，${top[0]}表现较好`,priority:'工业机器人安装调试、设备巡检与故障诊断',action:'完成一次岗位实训并保留维护记录、案例表达或模拟面试成果'};if(type==='direction'&&direction)return {intentionLabel:`已选择方向：${direction}`,profileSummary:`${data.learning}；${data.practice}`,priority:'方向核心课程与岗位任务对照',action:`完成一次${direction}相关课程项目或实训，记录适配度并复盘${weak[0]}的补足动作`};return {intentionLabel:'当前重点：比较专业相关方向',profileSummary:`${data.learning}；${data.practice}`,priority:'机械制图、工业机器人基础等共同专业课程',action:'通过课程项目或实训体验设备操作、现场维护和数字化设计任务，记录真实感受后再收敛方向'} }
    function academicChapter(){const advice=getAcademicAdvice();return chapter('academic','06','学业提升规划',`<p class="rounded-control bg-page p-3 text-[10px] leading-5 text-note">系统会根据你的个人意向、生涯画像表现和${studentGrowthMock[appState.planType]?.major||'所学专业'}，推荐更适合你的学习重点。</p>${recommendationCard('academic-1','学业提升建议',`${advice.intentionLabel}。结合你的${advice.profileSummary}，建议优先补充${advice.priority}，并${advice.action}。`)}${suggestionCard('专业课程','重点学习机械制图基础','为智能制造、设备技术和数字化设计建立共同专业基础。','','学校线上课程','查看课程')}${suggestionCard('方向课程','学习工业机器人与自动化产线技术','结合当前规划方向补充共同技术基础。','','学校线上课程','查看课程')}${suggestionCard('技能证书','了解专业相关技能证书','证书建议需结合培养方案、学校要求和学生发展路径确认。','','证书资讯','查看证书')}`)}
    function getPracticeAdvice(){const type=appState.planType||'exploration';const data=studentGrowthMock[type]||studentGrowthMock.exploration;const major=data.major||'所学专业';const direction=appState.selectedDirection||'';const job=appState.targetJob||'';const sorted=[...abilities].sort((a,b)=>b[1]-a[1]);const strong=sorted[0][0],gap=sorted[sorted.length-1][0];if(type==='job'&&job)return {intentionLabel:`目标岗位：${job}`,profileSummary:`已有${data.practice}，${strong}表现较好`,practiceFocus:'设备巡检、故障判断与维护记录',action:'完成一次岗位相关实训，保留任务过程、维护记录和一段岗位案例表达'};if(type==='direction'&&direction)return {intentionLabel:`已选择方向：${direction}`,profileSummary:`${data.learning}；${data.practice}`,practiceFocus:`${direction}相关项目、调试或技术服务任务`,action:`参加一次${direction}相关课程项目或实训，记录任务完成情况并复盘${gap}的补足动作`};return {intentionLabel:'当前重点：比较专业相关方向',profileSummary:`${data.learning}；${data.practice}`,practiceFocus:`${major}相关的设备操作、现场维护和数字化设计体验`,action:'分别完成至少两类职业体验，记录任务内容、兴趣感受和完成表现，再形成下一步优先体验方向'} }
    function practiceChapter(){const recommendations=practiceRecommendations[appState.planType]||practiceRecommendations.exploration;const advice=getPracticeAdvice();const adviceText=`${advice.intentionLabel}。结合你的${advice.profileSummary}，建议优先参与${advice.practiceFocus}，并${advice.action}。`;return chapter('practice','07','实践经历规划',`<p class="rounded-control bg-page p-3 text-[10px] leading-5 text-note">本章节仅提供实践类型和方向建议，不承担项目报名或实习投递，也不代表学校已经配置具体活动。生涯课程与实训入口由学业提升、资源推荐或能力短板章节承接。</p>${recommendationCard('practice-1','实践经历建议',adviceText)}<div class="mt-3 space-y-3">${recommendations.map((item,index)=>`<article class="rounded-control border border-line bg-white p-3"><div class="flex items-center justify-between gap-2"><span class="rounded bg-brand/15 px-2 py-1 text-[9px] text-deep">${index+1}. ${item.type}</span></div><p class="mt-2 text-[9px] text-note">推荐方向</p><h3 class="mt-1 text-[13px] font-bold leading-5">${item.direction}</h3><p class="mt-2 text-[10px] leading-5 text-body"><b class="text-title">推荐原因：</b>${item.reason}</p><p class="mt-2 rounded-lg bg-page px-2.5 py-2 text-[9px] leading-4 text-note"><b>边界说明：</b>${item.boundary}</p></article>`).join('')}</div>`)}
    function shortcomingResource(item){if(item.resourceSource==='company')return `<button onclick="openProduct('${item.resourceName}','${item.resourceProduct}','产品首页')" class="mt-2 flex w-full items-center rounded-lg bg-white px-3 py-2.5 text-left"><span class="mr-2 flex h-7 w-7 items-center justify-center rounded-lg bg-brand text-white">${icon('fa-arrow-up-right-from-square','text-[10px]')}</span><span class="flex-1"><b class="block text-[11px]">${item.resourceName}</b><small class="text-[9px] text-note">公司已有产品或应用</small></span><span class="text-[9px] text-deep">进入应用</span></button>`;if(item.resourceSource==='official')return `<button onclick="openOfficialResource('${item.resourceId}')" class="mt-2 flex w-full items-center rounded-lg bg-white px-3 py-2.5 text-left"><span class="mr-2 flex h-7 w-7 items-center justify-center rounded-lg bg-brand text-white">${icon('fa-building-columns','text-[10px]')}</span><span class="flex-1"><b class="block text-[11px]">${item.resourceName}</b><small class="text-[9px] text-note">学校已确认的官方学习资源</small></span><span class="text-[9px] text-deep">查看资源</span></button>`;return `<p class="mt-2 rounded-lg bg-white px-3 py-2.5 text-[9px] leading-4 text-note">暂无已配置的匹配资源。</p>`}
    function shortcomingChapter(){if(appState.lowData)return chapter('shortcoming','08','能力短板与提升建议',`<div class="rounded-control border border-dashed border-brand/30 bg-current p-4"><b class="text-[13px]">能力数据待完善</b><p class="mt-2 text-[10px] leading-5 text-note">当前数据不足以形成可靠的能力短板判断，暂不展示能力分、岗位差距或短板结论。完成相关测评、课程或实践后再形成可确认的新建议。</p></div>`);const recommendations=shortcomingRecommendations[appState.planType]||shortcomingRecommendations.exploration;return chapter('shortcoming','08','能力短板与提升建议',`<p class="rounded-control bg-page p-3 text-[10px] leading-5 text-note">以下内容依据现有可靠数据生成，共 ${recommendations.length} 条。探索型关注方向比较，方向型关注任务验证，岗位型关注岗位准备；表述不用于评价人格或给学生能力定性。</p>${recommendationCard('shortcoming-1','能力短板提升建议')}<div class="mt-3 space-y-3">${recommendations.slice(0,3).map((item,index)=>`<article class="rounded-control border border-line bg-current p-3"><div class="flex items-start"><span class="mr-3 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-brand text-[11px] font-bold text-white">${index+1}</span><div class="min-w-0 flex-1"><h3 class="text-[13px] font-bold">${item.name}</h3><p class="mt-1 text-[10px] leading-5 text-body">${item.description}</p></div></div><dl class="mt-3 space-y-2 border-t border-line pt-3 text-[10px] leading-5"><div><dt class="font-bold text-title">判断依据</dt><dd class="text-body">${item.evidence}</dd></div><div><dt class="font-bold text-title">可能影响</dt><dd class="text-body">${item.impact}</dd></div><div><dt class="font-bold text-title">原则性提升建议</dt><dd class="text-body">${item.suggestion}</dd></div><div><dt class="font-bold text-title">可用的关联资源</dt><dd>${shortcomingResource(item)}</dd></div></dl></article>`).join('')}</div>`)}
    function officialResourceCard(resource,school=false){return `<button onclick="openOfficialResource('${resource.id}')" class="soft-card mt-3 flex w-full items-center rounded-control border border-brand/15 bg-current p-3 text-left"><span class="mr-3 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-brand text-white">${icon(school?'fa-school':'fa-building-columns','text-[13px]')}</span><span class="min-w-0 flex-1"><span class="flex items-center gap-1"><b class="truncate text-[12px]">${resource.name}</b><em class="shrink-0 rounded bg-white px-1.5 py-0.5 text-[8px] not-italic text-deep">${school?'学校资源·优先推荐':'官方资源'}</em></span><small class="mt-1 block text-[9px] text-note">${resource.platform}・${resource.category}・${resource.stage}</small><small class="mt-1 block text-[9px] text-body">推荐依据：机电一体化技术・${planTypeProfiles[appState.planType].label}・${developmentPaths.find(path=>path[0]===appState.developmentPath)?.[1]}・${resource.tags.join('、')}</small></span>${icon('fa-arrow-up-right-from-square','ml-2 text-[10px] text-deep')}</button>`}

    function planItemFeedbackKey(itemId){return `${appState.activePlanId}:${itemId}`}

    function getPlanItemFeedback(item){const key=planItemFeedbackKey(item.id);return appState.planActionFeedback[key]||{itemId:item.id,planBookId:appState.activePlanId,completionMode:item.completionMode,status:item.initialStatus||'pending',completionSource:item.completionSource||'',completedAt:item.completedAt||'',cancelledAt:'',careerArchiveSyncedAt:item.completedAt||'',updateCandidate:false,history:[]}}
    function reportPlanItemProgress(itemId,status,source='application',shouldRender=true){const item=findPlanItem(itemId);if(!item||item.completionMode==='display')return;const key=planItemFeedbackKey(itemId),previous=getPlanItemFeedback(item),now=new Date().toLocaleString('zh-CN',{hour12:false});const feedback={...previous,itemId,planBookId:appState.activePlanId,completionMode:item.completionMode,status,completionSource:source,careerArchiveSyncedAt:now,history:[...(previous.history||[]),{from:previous.status,to:status,at:now,source}]};if(status==='completed'){feedback.completedAt=now;feedback.updateCandidate=true}else if(previous.status==='completed'){feedback.cancelledAt=now;feedback.updateCandidate=true}appState.planActionFeedback[key]=feedback;persistState();if(shouldRender)render();if(status==='completed')toast('该事项已完成，已回写生涯档案并形成待确认的规划变化');else if(status==='in_progress')toast('已记录为进行中');else toast('已取消完成，历史记录继续保留')}
    function togglePlanItemCompletion(itemId){const item=findPlanItem(itemId);if(!item||item.completionMode!=='manual')return;const feedback=getPlanItemFeedback(item);reportPlanItemProgress(itemId,feedback.status==='completed'?'pending':'completed','student')}

ss="text-[8px] text-note">仅供查看，不记录完成</span>'}</div></div></div></article>`}

    }

    function stageAuxText(stage,index,current){return `第 ${index+1} 阶段`}
    function getStagePlanAnalysis(stage,index){const type=appState.planType||'exploration';const data=studentGrowthMock[type]||studentGrowthMock.exploration;const direction=appState.selectedDirection||data.intention||'专业相关方向';const job=appState.targetJob||'目标岗位';const major=data.major||'当前专业';const profile=abilities.slice().sort((a,b)=>b[1]-a[1]);const strong=profile[0][0],gap=profile[profile.length-1][0];const goals={exploration:[`结合${major}专业认识自己，比较${direction}相关工作内容`,`围绕兴趣线索开展课程和职业体验，逐步形成方向判断` ,`根据真实体验记录适配感受，为后续方向选择积累依据`],direction:[`围绕已选择的${direction}方向，明确需要验证的代表岗位和能力要求`,`结合${major}专业课程与实践记录补齐方向通用能力`,`通过项目或实训复盘方向适配度，形成可调整的准备计划`],job:[`围绕${job}的核心任务建立岗位准备目标`,`结合${major}专业基础和${strong}表现，补充岗位要求中的关键能力`,`通过岗位实训、成果记录和模拟面试完成就业衔接`]}[type]||[];const focus={exploration:[`梳理${major}专业对应的职业方向和工作内容`,`记录课程、实训或体验中的兴趣与优势`,`补充${gap}相关的真实体验`],direction:[`对照${direction}代表岗位梳理共同能力要求`,`用一次课程项目或实训验证方向任务`,`针对${gap}制定下一步补足动作`],job:[`拆解${job}的岗位任务并保留过程记录`,`把${strong}优势转化为可展示成果`,`通过模拟面试练习${gap}相关表达`]}[type]||[];const priority=type==='job'?4:type==='direction'?3:0;return {stageNumber:index+1,stageName:stage.name,goal:goals[index]||goals[0],growthFocus:focus.slice(0,3),priority:index===priority}}
    getCurrentStage=function(){const analyses=semesterStageMap.map((stage,index)=>getStagePlanAnalysis(stage,index));return semesterStageMap[analyses.findIndex(item=>item.priority)]||semesterStageMap[0]}
    const originalSummaryChapter=summaryChapter;
    summaryChapter=function(){
      let html=originalSummaryChapter();
      const currentStage=getCurrentStage();
      const stageIndex=semesterStageMap.findIndex(stage=>stage.semester===currentStage.semester);
      html=html.replace('<small class="text-[10px] text-note">当前阶段</small>','<small class="text-[10px] text-note">建议优先关注阶段</small>');
      return html.replace(`<b class="mt-1 block text-[14px]">${currentStage.name}<span class="ml-1 text-[10px] font-normal text-note">（${currentStage.semester}）</span></b>`,`<b class="mt-1 block text-[14px]">${currentStage.name}</b><small class="mt-1 block text-[9px] text-note">${stageAuxText(currentStage,stageIndex>=0?stageIndex:0,true)}</small>`);
    }
    roadmapChapter=function(){
      const currentStage=getCurrentStage();
      return chapter('roadmap','05','职业发展阶段目标',`<div class="space-y-3">${semesterStageMap.map((stage,i)=>{const analysis=getStagePlanAnalysis(stage,i);const current=analysis.priority;return `<div class="rounded-control border ${current?'border-brand/30 bg-current':'border-line bg-white'} p-3"><div class="flex items-start"><span class="mr-3 flex h-7 w-7 shrink-0 items-center justify-center rounded-full ${current?'bg-brand text-white':'bg-pale text-deep'} text-[11px]">${i+1}</span><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><div><b class="text-[12px]">${analysis.stageName}</b><small class="mt-0.5 block text-[9px] text-note">第 ${analysis.stageNumber} 阶段</small></div>${current?'<span class="rounded-full bg-brand px-2 py-1 text-[8px] text-white">建议优先关注</span>':''}</div><p class="mt-1 text-[10px] leading-5 text-body"><span class="text-note">阶段发展目标：</span>${analysis.goal}</p><ol class="mt-2 space-y-1">${analysis.growthFocus.map((focus,index)=>`<li class="flex text-[10px] leading-5 text-body"><span class="mr-2 text-deep">${index+1}.</span>${focus}</li>`).join('')}</ol></div></div></div>`}).join('')}</div><p class="mt-3 rounded-control bg-page px-3 py-2 text-[10px] leading-5 text-note">阶段路径由 AI 根据你的规划选择、能力表现、测评结果、学习实践记录和专业信息生成；建议优先关注阶段表示当前更适合优先完善的成长方向，后续会随新的成长数据持续调整。</p>`)
    }

    const safeApplyGrowthDataUpdate=applyGrowthDataUpdate;
    applyGrowthDataUpdate=function(){
      try{
        return safeApplyGrowthDataUpdate();
      }catch(error){
        console.error('AI career plan update failed',error);
        const plan=activePlan();
        const updates=planDataChanges();
        appState.lastUpdateResult={success:true,version:plan.version,previousVersion:plan.version,sections:updates.map(item=>item.section),summary:'系统已完成本次成长数据同步处理，当前规划可继续查看。'};
        appState.useNewData=null;
        appState.updatingPlan=false;
        persistState();
        navigate('updateResult');
      }
    }

    updateResultPage=function(){
      const plan=activePlan();
      const result=appState.lastUpdateResult||{success:true,version:plan.version,previousVersion:plan.version,sections:[],summary:'系统已完成本次成长数据同步处理，当前规划可继续查看。'};
      const sections=(result.sections||[]).filter(Boolean);
      return pageWrap(`${header('更新结果')}<div class="safe-bottom px-4 pb-8 pt-8"><section class="rounded-card border border-brand/20 bg-current p-5 text-center shadow-soft"><span class="mx-auto flex h-12 w-12 items-center justify-center rounded-[15px] bg-brand text-white">${icon('fa-check','text-[17px]')}</span><h2 class="mt-4 text-[18px] font-bold">规划已完成同步</h2><p class="mt-2 text-[11px] leading-5 text-body">${result.summary}</p></section><section class="mt-4 rounded-card border border-line bg-white p-4 shadow-soft"><div class="flex items-center justify-between"><h3 class="text-[14px] font-bold">同步摘要</h3><span class="rounded bg-brand/15 px-2 py-1 text-[9px] text-deep">${result.version} 当前版本</span></div>${sections.length?`<div class="mt-3 space-y-2">${sections.map(section=>`<div class="flex items-center rounded-control bg-page p-3"><span class="mr-3 flex h-7 w-7 items-center justify-center rounded-lg bg-brand/15 text-deep">${icon('fa-check','text-[9px]')}</span><span class="text-[11px]">${section}</span></div>`).join('')}</div>`:`<p class="mt-3 rounded-control bg-page p-3 text-[10px] leading-5 text-body">当前规划可继续查看，后续如有新的建议会再次提醒你确认。</p>`}<p class="mt-3 text-[9px] leading-5 text-note">已确认的个人情况和校正结果不会被静默覆盖。</p></section><button onclick="appState.reportMode='current';navigate('report')" class="primary-action mt-5 h-12 w-full rounded-card bg-brand text-[13px] font-bold text-white">查看当前规划书</button><button onclick="navigate('versions')" class="mt-2 h-11 w-full text-[12px] text-deep">查看版本记录</button></div>`)
    }

    /* -------------------- 渲染入口 -------------------- */
    function render(){persistState();const pages={home:homePage,notifications:notificationsPage,notificationDetail:notificationDetailPage,generate:generatePage,generating:generatingPage,update:updatePage,updateResult:updateResultPage,versions:versionsPage,report:reportPage,feedbackAdjusting:feedbackAdjustingPage,adjustmentPreview:adjustmentPreviewPage,product:productPage};const app=document.getElementById('app');app.innerHTML=(pages[appState.page]||homePage)()}
    const originalPracticeChapter=practiceChapter;
    practiceChapter=function(){return originalPracticeChapter().replace('<div class="mt-3 space-y-3">',practiceRecordEntry(true)+'<div class="mt-3 space-y-3">')};
    const renderPlanningPage=render;
    render=function(){
      const recordPage=practiceRecordPage();
      if(recordPage===null)renderPlanningPage();
      else document.getElementById('app').innerHTML=pageWrap(recordPage);
    };
    if(initialView==='records'||initialView==='archive')appState.page=initialView;
    render();
    document.addEventListener('click',function(event){const section=event.target.closest&&event.target.closest('section[id]');if(section&&window.parent!==window){window.parent.postMessage({type:'ai-career-plan-annotation',sectionId:section.id},'*')}});
    const initialSection=new URLSearchParams(location.search).get('section');
    if(initialView==='report'&&initialSection)setTimeout(()=>document.getElementById(initialSection)?.scrollIntoView({behavior:'smooth',block:'start'}),120);
  </script>
</body>
</html>
